name: Deploy Workers

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "workers/**"
      - "web/**"
      - "pyproject.toml"
      - "wrangler.jsonc"
      - ".github/workflows/deploy-workers.yml"
  workflow_dispatch:

# Required repository secrets:
#   CLOUDFLARE_API_TOKEN   - API token with Workers Scripts + D1 edit
#   CLOUDFLARE_ACCOUNT_ID  - account id
# One-time worker secrets (set manually, NOT in CI):
#   wrangler secret put NVIDIA_API_KEYS
#   wrangler secret put ADMIN_TOKEN

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Vendor Python deps for Workers (pywrangler sync)
        run: |
          # pywrangler refuses a root requirements.txt; move it aside during sync.
          mv requirements.txt /tmp/requirements.server.txt
          uvx --from workers-py pywrangler sync
          mv /tmp/requirements.server.txt requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build admin SPA
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Layout assets for /admin prefix
        run: |
          cd web/dist
          mkdir -p admin
          # Mirror the whole dist root (index.html, assets/, favicon, logos,
          # manifest) into admin/ so /admin/* resolves to real files.
          for f in *; do [ "$f" != "admin" ] && cp -r "$f" admin/; done

      - name: Stage app package into the Workers bundle
        run: |
          cp -r app workers/app
          find workers/app -name __pycache__ -type d -prune -exec rm -rf {} +

      - name: Check deploy config
        id: cfg
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Enable CPU limit (paid plan only)
        if: steps.cfg.outputs.deploy == 'true' && vars.WORKERS_PAID == 'true'
        run: |
          python3 -c "import json; p='wrangler.jsonc'; d=json.load(open(p)); d['limits']={'cpu_ms':300000}; json.dump(d, open(p,'w'), indent=2)"

      - name: Install wrangler
        if: steps.cfg.outputs.deploy == 'true'
        run: npm install -g wrangler@4

      - name: Apply D1 migrations
        if: steps.cfg.outputs.deploy == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler d1 migrations apply nim-proxy --remote

      - name: Deploy Worker
        if: steps.cfg.outputs.deploy == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler deploy

      - name: Deploy skipped (no Cloudflare secrets)
        if: steps.cfg.outputs.deploy != 'true'
        run: echo "CLOUDFLARE_API_TOKEN not set — build only, deploy skipped."
