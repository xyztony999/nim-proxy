# 可选：Nginx 反代 + HTTPS（挂域名时使用）
# 安装: apt install -y nginx certbot python3-certbot-nginx
# 放到 /etc/nginx/sites-available/nim-proxy 并软链到 sites-enabled，
# 把 server_name 换成你的域名，然后:
#   certbot --nginx -d api.example.com   # 自动签发 HTTPS 并续期

server {
    listen 80;
    listen [::]:80;
    server_name api.example.com;   # 改成你的域名

    # base64 图片等多模态请求体可能很大
    client_max_body_size 64m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        # SSE 流式必需：关闭缓冲
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection "";
        proxy_set_header X-Accel-Buffering off;

        proxy_read_timeout 600s;
        proxy_send_timeout 600s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
